# --------------------------------------------------------------------------
# DataSource : use this if switching to MySQL
#   (comment out the 4 Oracle lines above, then uncomment the 4 lines below)
#   - Also uncomment the mysql-connector-j dependency in build.gradle.
#   - There is no sequence support, so change @GeneratedValue on the
#     entities to IDENTITY.
# --------------------------------------------------------------------------
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost:3306/climbon?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul
#spring.datasource.username=climbon
#spring.datasource.password=climbon1234

# --------------------------------------------------------------------------
# HikariCP connection pool
# --------------------------------------------------------------------------
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.auto-commit=true

# --------------------------------------------------------------------------
# JPA
#   ddl-auto=none : tables are created directly from db/schema.sql
#     (the standard practice for real projects)
#   Leaving it as create/update lets the entities overwrite the tables,
#   which can wipe out production data.
# --------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.open-in-view=false

# --------------------------------------------------------------------------
# File upload
# --------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# 업로드 루트 경로 (OS에 맞게 수정)
#   Windows : C:/kd/deploy/climbon/
#   Linux   : /home/ubuntu/deploy/climbon/
climbon.upload.dir=C:/kd/deploy/climbon/

# --------------------------------------------------------------------------
# JWT
#   The secret must be at least 32 bytes (256 bits) for HS256 signing to work.
#   In production, inject it via an environment variable (${JWT_SECRET}).
# --------------------------------------------------------------------------
jwt.secret=climbon-secret-key-for-jwt-hs256-please-change-this-in-production-2026
jwt.access-token-validity=1800000
jwt.refresh-token-validity=1209600000

# --------------------------------------------------------------------------
# FastAPI (AI server) endpoint
# --------------------------------------------------------------------------
climbon.ai.base-url=http://139.150.91.194:11261
climbon.ai.timeout=60000

