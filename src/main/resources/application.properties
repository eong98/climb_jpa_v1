spring.application.name=climbon
server.port=9200

# --------------------------------------------------------------------------
# DataSource : Oracle (기본)
# --------------------------------------------------------------------------
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@1.201.122.5:1521:XE
spring.datasource.username=climbon
spring.datasource.password=kd1169017000

# --------------------------------------------------------------------------
# DataSource : MySQL로 쓸 경우 (위 Oracle 4줄 주석 처리 후 아래 주석 해제)
#   - build.gradle의 mysql-connector-j 주석도 함께 해제하세요.
#   - 시퀀스가 없으므로 Entity의 @GeneratedValue를 IDENTITY로 바꿔야 합니다.
# --------------------------------------------------------------------------
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost:3306/climbon?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul
#spring.datasource.username=climbon
#spring.datasource.password=climbon1234

# --------------------------------------------------------------------------
# HikariCP 커넥션 풀
# --------------------------------------------------------------------------
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.auto-commit=true

# --------------------------------------------------------------------------
# JPA
#   ddl-auto=none : 테이블은 db/schema.sql로 직접 만든다 (실무 기본값)
#   create/update로 두면 Entity가 테이블을 덮어써서 운영 데이터가 날아갈 수 있음
# --------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.open-in-view=false

# --------------------------------------------------------------------------
# 파일 업로드
# --------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# 업로드 루트 경로 (OS에 맞게 수정)
#   Windows : C:/kd/deploy/climbon/
#   Linux   : /home/ubuntu/deploy/climbon/
climbon.upload.dir=C:/kd/deploy/climbon/

# --------------------------------------------------------------------------
# JWT
#   secret은 최소 32바이트(256bit) 이상이어야 HS256 서명이 가능합니다.
#   실무에서는 환경변수(${JWT_SECRET})로 주입하세요.
# --------------------------------------------------------------------------
jwt.secret=climbon-secret-key-for-jwt-hs256-please-change-this-in-production-2026
jwt.access-token-validity=1800000
jwt.refresh-token-validity=1209600000

# --------------------------------------------------------------------------
# FastAPI (AI 서버) 연동 주소
# --------------------------------------------------------------------------
climbon.ai.base-url=http://139.150.91.194:11261
climbon.ai.timeout=60000

# --------------------------------------------------------------------------
# 메일 (비밀번호 찾기 등) - 환경변수로 주입
# --------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --------------------------------------------------------------------------
# 로깅
# --------------------------------------------------------------------------
logging.level.dev.jpa.climbon=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
